<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login - Olius </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>

<body>
    
    <div class="login">

        <div class="lado-esquerdo">

             <h1>Olius conecta<br>você ao que<br>importa.</h1>

            <img class="logo-fundo" src="logo.png" alt="Logo Olius">

            <img class="celular" src="celular.png" alt="Celular com aplicativo Olius">

            <div class="pontinhos"></div>

</div>



        <div class = "lado-direito">

        <img class="logo" src="logo.png" alt="Logo Olius">

            <h2>Bem-vindo ao Olius!</h2>

            <p>Cadastre sua empresa</p>

            <input type="text" placeholder="Digite seu email / telefone">

            <input type="text" placeholder="Digite o CNPJ da empresa">

            <input type="password" placeholder="Digite sua senha">
            
            <div class="botoes">
                <button type="button">Cancelar</button>
                <button type="button">Entrar</button>

            </div>

            <p class="ou">OU</p>

            <div class="login-social">
                <button type="button">Continuar com Google</button>
                <button type="button">Continuar com Apple</button>
            </div>

            <p class="cadastro">
                Ainda não tem uma conta? 
                <a href="#">Cadastre-se</a>
            </p>

        </div>

    </div>
</body>
</html>
