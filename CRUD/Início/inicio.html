<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Início - Olius</title>

    <link rel="stylesheet" href="inicio.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="logo-area">
                <img src="../logo.png" alt="Olius">
            </div>

            <nav>

                <a href="#" class="menu-item ativo">
                    <img src="../inicio.png" alt="">
                    <span>Início</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="../historico.png" alt="">
                    <span>Histórico</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="../relatorio.png" alt="">
                    <span>Relatórios</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="../transparencia.png" alt="">
                    <span>Transparência</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="../ranking.png" alt="">
                    <span>Ranking</span>
                </a>

                <a href="#" class="menu-item">
                    <img src="../configuracao.png" alt="">
                    <span>Configurações</span>
                </a>

            </nav>

        </aside>


        <main class="conteudo">

            <header class="topo">

                <div></div>

                <div class="usuario">

                    <img
                        class="notificacao"
                        src="../sino.png"
                        alt="Notificações"
                    >

                    <div class="avatar">
                        N
                    </div>

                    <span>Naldo</span>

                </div>

            </header>


            <section class="principal">

                <div class="cabecalho">

                    <div>
                        <h1>Olá, Naldo!</h1>
                        <p>Que bom ter você por aqui.</p>
                    </div>

                    <div class="acoes">

                        <button class="registrar">
                            <span>＋</span>
                            Registrar óleo
                        </button>

                        <button class="coleta">

                            <img src="../caminhao.png" alt="">

                            Solicitar coleta

                        </button>

                    </div>

                </div>


                <div class="cards">

                    <div class="card agua">

                        <div class="card-titulo">

                            <img src="../agua.png" alt="Água">

                            <span>Água Preservada</span>

                        </div>

                        <strong>
                            625.9K<span>L</span>
                        </strong>

                    </div>


                    <div class="card oleo">

                        <div class="card-titulo">

                            <img src="../oleo.png" alt="Óleo">

                            <span>Óleo Coletado</span>

                        </div>

                        <strong>
                            50<span>L</span>
                        </strong>

                    </div>


                    <div class="card co2">

                        <div class="card-titulo">

                            <img src="../co2.png" alt="CO₂">

                            <span>CO₂ Evitado</span>

                        </div>

                        <strong>
                            7.5<span>Kg</span>
                        </strong>

                    </div>


                    <div class="card biodiesel">

                        <div class="card-titulo">

                            <img src="../biodiesel.png" alt="Biodiesel">

                            <span>Biodiesel</span>

                        </div>

                        <strong>
                            50.3<span>L</span>
                        </strong>

                    </div>

                </div>


                <section class="grafico">

                    <div class="grafico-info">

                        <h2>
                            200<span>L</span>
                        </h2>

                        <p>Litros de óleo</p>

                    </div>


                    <div class="grafico-area">

                        <div class="barras">

                            <div class="barra-item">
                                <div class="barra janeiro"></div>
                                <span>Jan</span>
                            </div>

                            <div class="barra-item">
                                <div class="barra fevereiro"></div>
                                <span>Fev</span>
                            </div>

                            <div class="barra-item">
                                <div class="barra marco"></div>
                                <span>Mar</span>
                            </div>

                            <div class="barra-item">
                                <div class="barra abril"></div>
                                <span>Abr</span>
                            </div>

                            <div class="barra-item">
                                <div class="barra maio"></div>
                                <span>Mai</span>
                            </div>

                            <div class="barra-item">
                                <div class="barra junho"></div>
                                <span>Jun</span>
                            </div>

                            <div class="barra-item">
                                <div class="barra julho"></div>
                                <span>Jul</span>
                            </div>

                        </div>


                        <div class="escala">

                            <span>250L</span>
                            <span>200L</span>
                            <span>150L</span>
                            <span>100L</span>
                            <span>50L</span>
                            <span>0L</span>

                        </div>

                    </div>


                    <img
                        class="logo-grafico"
                        src="../logo.png"
                        alt="Olius"
                    >

                </section>

            </section>

        </main>

    </div>

</body>
</html>
