
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Empresa - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/adicionar/nova-empresa.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- formulário de cadastro -->
    <main class="formulario">

        <h1>Nova Empresa</h1>

        <form id="formEmpresa">

            <div class="campos">

                <div class="campo">
                    <label for="nome">Nome da empresa *</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo">
                    <label for="cnpj">CNPJ *</label>
                    <input
                        type="text"
                        id="cnpj"
                        name="cnpj"
                        placeholder="00.000.000/0000-00"
                        maxlength="18"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        required
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="plano">Plano *</label>
                    <select id="plano" name="plano" required>
                        <option value="" selected disabled>Selecione um plano</option>
                        <option value="basico">Básico</option>
                        <option value="premium">Premium</option>
                        <option value="empresarial">Empresarial</option>
                    </select>
                </div>

                <div class="campo campo-completo">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="" selected disabled>Selecione o status</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                        <option value="pendente">Pendente</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Adicionar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
