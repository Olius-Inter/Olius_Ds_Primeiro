
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Solicitação de Coleta - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/adicionar/nova-solicitacao.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Nova Solicitação de Coleta</h1>

        <!-- dados da solicitação -->
        <form id="formSolicitacao">

            <div class="campos">

                <div class="campo">
                    <label for="empresa">Empresa solicitante *</label>
                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="data">Data da solicitação *</label>
                    <input
                        type="date"
                        id="data"
                        name="data"
                        required
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="volume">Volume estimado *</label>

                    <!-- volume em litros -->
                    <div class="volume-litros">
                        <input
                            type="number"
                            id="volume"
                            name="volume"
                            min="0.1"
                            step="0.1"
                            required
                        >
                        <span>L</span>
                    </div>
                </div>

                <div class="campo campo-completo">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="" selected disabled>Selecione o status</option>
                        <option value="pendente">Pendente</option>
                        <option value="aprovada">Aprovada</option>
                        <option value="em_andamento">Em andamento</option>
                        <option value="concluida">Concluída</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Adicionar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
