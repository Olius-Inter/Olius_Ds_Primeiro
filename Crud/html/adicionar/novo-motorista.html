
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Motorista - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/adicionar/novo-motorista.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Novo Motorista</h1>

        <!-- dados do motorista -->
        <form id="formMotorista">

            <div class="campos">

                <div class="campo">
                    <label for="nome">Nome do motorista *</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="empresa">Empresa responsável *</label>
                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="licenca">Licença (CNH) *</label>
                    <input
                        type="text"
                        id="licenca"
                        name="licenca"
                        required
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="" selected disabled>Selecione o status</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                        <option value="pendente">Pendente</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button
                    type="button"
                    class="botao-cancelar"
                >
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Adicionar
                </button>

            </div>

        </form>

    </main>

</body>
</html>
