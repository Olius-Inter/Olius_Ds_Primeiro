<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - Olius</title>
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    
    <div class="tela-login">
        <div class="rectangle-parent">
            <div class="group-child"></div>
            <div class="group-item"></div>
        </div>

        <div class="bem-vindo-ao-olius">Bem-vindo ao Olius!</div>
        <div class="olius-conecta-voc">Olius conecta você ao que importa.</div>
        <div class="cadastre-sua-empresa">Cadastre sua empresa</div>

        <!-- Campos de Entrada (Idealmente transformados em inputs reais no CSS) -->
        <div class="component-15">
            <div class="component-15-child"></div>
            <div class="digite-seu-nome">Digite seu email / telefone</div>
        </div>

        <div class="component-16">
            <div class="component-16-child"></div>
            <div class="digite-seu-nome">Digite o CNPJ da empresa</div>
        </div>

        <div class="component-17">
            <div class="component-15-child"></div>
            <div class="digite-seu-nome">Digite sua senha</div>
        </div>

        <!-- Imagem Geral / Mockup -->
        <img class="image-55-icon" src="../Olius Mockup.png" alt="Mockup Olius">
        
        <!-- Divisor OU -->
        <div class="ou">OU</div>
        
        <!-- Botão Continuar com Google -->
        <div class="component-18">
            <div class="component-18-child"></div>
            <div class="continuar-com-google">Continuar com Google</div>
            <img class="icons8-google-logo-48-2" src="../google logo.png" alt="Logo Google">
        </div>

        <!-- Botão Continuar com Apple -->
        <div class="component-19">
            <div class="component-19-child"></div>
            <img class="image-55-icon2" src="../apple logo.png" alt="Logo Apple">
            <div class="continuar-com-apple">Continuar com Apple</div>
        </div>

        <div class="ainda-no-tem">Ainda não tem uma conta?</div>
        <b class="cadastre-se">Cadastre-se</b>

        <!-- Botões de Ação -->
        <div class="component-20">
            <div class="component-20-child"></div>
            <div class="entrar">Entrar</div>
        </div>

        <div class="component-21">
            <div class="component-21-child"></div>
            <div class="cancelar">Cancelar</div>
        </div>

        <!-- Logotipo Principal -->
        <img class="logo-oficial-icon" src="../olius logo.png" alt="Logotipo Olius">
    </div>

</body>
</html>
