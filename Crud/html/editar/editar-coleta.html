
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Coleta - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/editar/editar-coleta.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Editar Coleta</h1>

        <!-- dados da coleta -->
        <form id="formColeta">

            <div class="campos">

                <div class="campo">
                    <label for="data">Data da coleta *</label>
                    <input type="date" id="data" name="data"
                        value="2026-10-15" required>
                </div>

                <div class="campo">
                    <label for="empresa">Empresa *</label>
                    <input type="text" id="empresa" name="empresa"
                        value="Restaurante Sabor Natural" required>
                </div>

                <div class="campo">
                    <label for="motorista">Motorista *</label>
                    <input type="text" id="motorista" name="motorista"
                        value="Carlos Oliveira" required>
                </div>

                <div class="campo">
                    <label for="volume">Volume coletado (litros) *</label>
                    <input type="number" id="volume" name="volume"
                        value="50" min="1" required>
                </div>

                <div class="campo campo-completo">
                    <label for="avaliacao">Avaliação *</label>
                    <select id="avaliacao" name="avaliacao" required>
                        <option value="1">1 estrela</option>
                        <option value="2">2 estrelas</option>
                        <option value="3">3 estrelas</option>
                        <option value="4" selected>4 estrelas</option>
                        <option value="5">5 estrelas</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Salvar alterações
                </button>

            </div>

        </form>

    </main>

</body>
</html>
