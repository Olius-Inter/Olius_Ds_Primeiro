
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Solicitação - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/editar/editar-solicitacao.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Editar Solicitação</h1>

        <!-- dados da solicitação -->
        <form id="formSolicitacao">

            <div class="campos">

                <div class="campo">
                    <label for="empresa">Empresa solicitante *</label>
                    <input type="text" id="empresa" name="empresa"
                        value="Restaurante Sabor Natural" required>
                </div>

                <div class="campo">
                    <label for="data">Data da solicitação *</label>
                    <input type="date" id="data" name="data"
                        value="2026-10-15" required>
                </div>

                <div class="campo">
                    <label for="volume">Volume estimado (litros) *</label>
                    <input type="number" id="volume" name="volume"
                        value="100" min="1" required>
                </div>

                <div class="campo">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="pendente">Pendente</option>
                        <option value="aprovada" selected>Aprovada</option>
                        <option value="concluida">Concluída</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Salvar alterações
                </button>

            </div>

        </form>

    </main>

</body>
</html>
