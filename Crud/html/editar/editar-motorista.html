
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Motorista - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/editar/editar-motorista.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Editar Motorista</h1>

        <!-- dados do motorista -->
        <form id="formMotorista">

            <div class="campos">

                <div class="campo">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome"
                        value="Carlos Oliveira" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email"
                        value="carlos.oliveira@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone"
                        value="(11) 97777-6666" required>
                </div>

                <div class="campo">
                    <label for="empresa">Empresa responsável *</label>
                    <input type="text" id="empresa" name="empresa"
                        value="Olius Transportes" required>
                </div>

                <div class="campo campo-completo">
                    <label for="licenca">CNH *</label>
                    <input type="text" id="licenca" name="licenca"
                        value="12345678900" required>
                </div>

                <div class="campo campo-completo">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="ativo" selected>Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Salvar alterações
                </button>

            </div>

        </form>

    </main>

</body>
</html>
