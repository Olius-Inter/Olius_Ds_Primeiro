
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Usuário - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/adicionar/novo-usuario.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Editar Usuário</h1>

        <!-- dados do usuário -->
        <form id="formUsuario">

            <div class="campos">

                <div class="campo">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome"
                        value="Mariana Oliveira" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email"
                        value="mariana.oliveira@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone"
                        value="(11) 98888-7777" required>
                </div>

                <div class="campo">
                    <label for="tipoUsuario">Tipo de usuário *</label>
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="B2B" selected>B2B - Empresa</option>
                        <option value="B2C">B2C - Usuário comum</option>
                    </select>
                </div>

                <div class="campo campo-completo">
                    <label for="endereco">Endereço *</label>
                    <input type="text" id="endereco" name="endereco"
                        value="Rua das Flores, 150 - São Paulo, SP" required>
                </div>

                <div class="campo campo-completo">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="ativo" selected>Ativo</option>
                        <option value="inativo">Inativo</option>
                        <option value="pendente">Pendente</option>
                    </select>
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Salvar alterações
                </button>

            </div>

        </form>

    </main>

</body>
</html>
