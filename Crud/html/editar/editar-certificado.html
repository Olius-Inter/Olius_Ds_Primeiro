
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Certificado - Olius</title>

    <!-- estilos da página -->
    <link rel="stylesheet" href="../../css/editar/editar-certificado.css">

    <!-- fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="formulario">

        <h1>Editar Certificado</h1>

        <!-- dados do certificado -->
        <form id="formCertificado">

            <div class="campos">

                <div class="campo">
                    <label for="empresa">Empresa *</label>
                    <input type="text" id="empresa" name="empresa"
                        value="Restaurante Sabor Natural" required>
                </div>

                <div class="campo">
                    <label for="data">Data de emissão *</label>
                    <input type="date" id="data" name="data"
                        value="2026-10-15" required>
                </div>

                <div class="campo campo-completo">
                    <label for="volume">Volume total (litros) *</label>
                    <input type="number" id="volume" name="volume"
                        value="150" min="1" required>
                </div>

                <div class="campo campo-completo">
                    <label for="arquivo">Arquivo PDF do certificado</label>

                    <!-- o navegador não permite preencher o arquivo automaticamente -->
                    <p>Arquivo atual: certificado-olius.pdf</p>

                    <input type="file" id="arquivo" name="arquivo"
                        accept=".pdf,application/pdf">
                </div>

            </div>

            <!-- botões do formulário -->
            <div class="botoes-formulario">

                <button type="button" class="botao-cancelar">
                    Cancelar
                </button>

                <button type="submit" class="botao-adicionar">
                    Salvar alterações
                </button>

            </div>

        </form>

    </main>

</body>
</html>
